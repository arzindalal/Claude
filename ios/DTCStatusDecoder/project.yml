# XcodeGen spec: `brew install xcodegen && xcodegen` generates DTCStatusDecoder.xcodeproj
name: DTCStatusDecoder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  DTCStatusDecoder:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dtcstatusdecoder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: DTC Status
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
